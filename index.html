                    <button type="button" class="ddlink" onClick="{{sub.go}}" style="min-height: 44px; padding: 10px 14px; border: none; border-radius: 10px; background: transparent; text-align: left; white-space: nowrap; font-size: 15px; font-weight: 500; color: #2B2B75; cursor: pointer">{{sub.label}}</button>
                  </sc-for>
                </div>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </nav>
      <div style="display: flex; align-items: center; gap: 8px">
        <button type="button" aria-label="검색" onClick="{{goClasses}}" style="width: 44px; height: 44px; border: 1px solid #E5E7EE; border-radius: 999px; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2B75" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        </button>
        <button type="button" aria-label="전체 메뉴" aria-expanded="{{menuOpen}}" onClick="{{toggleMenu}}" style="width: 44px; height: 44px; border: 1px solid #E5E7EE; border-radius: 999px; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B2B75" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
        </button>
      </div>
    </div>

    <!-- 전체 메뉴 -->
    <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
      <div style="border-top: 1px solid #E5E7EE; background: #FFFFFF">
        <div style="max-width: 1200px; margin: 0 auto; padding: 24px 24px 32px; box-sizing: border-box; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 24px">
          <sc-for list="{{megaCols}}" as="col" hint-placeholder-count="6">
            <div style="display: flex; flex-direction: column">
              <span style="font-weight: 900; font-size: 15px; padding-bottom: 6px">{{col.title}}</span>
              <sc-for list="{{col.links}}" as="l" hint-placeholder-count="3">
                <button type="button" onClick="{{l.go}}" style="border: none; background: none; padding: 9px 0; text-align: left; font-size: 14px; color: #3A4058; cursor: pointer">{{l.label}}</button>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>
  </header>

  <!-- 서브 페이지 머리 -->
  <sc-if value="{{isSub}}" hint-placeholder-val="{{ false }}">
    <div style="background: #2B2B75; color: #FFFFFF">
      <div style="max-width: 1200px; margin: 0 auto; padding: 48px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #C9CEE0">
          <button type="button" onClick="{{goHome}}" style="border: none; background: none; padding: 0; color: #C9CEE0; font-size: 13px; cursor: pointer">홈</button>
          <span aria-hidden="true">›</span>
          <span style="color: #FFFFFF">{{crumb}}</span>
        </div>
        <h1 style="margin: 0; font-size: 38px; font-weight: 900; letter-spacing: -1px">{{pageTitle}}</h1>
        <p style="margin: 0; font-size: 16px; color: #DADDEA">{{pageDesc}}</p>
      </div>
    </div>
  </sc-if>

  <!-- ===================== 홈 ===================== -->
  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <section aria-label="메인 배너" style="background: {{slide.bg}}; color: #FFFFFF">
      <div style="max-width: 1200px; margin: 0 auto; padding: 64px 24px 40px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 40px; min-height: 420px">
        <div style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 18px; min-width: 0">
          <span style="align-self: flex-start; font-size: 13px; font-weight: 700; letter-spacing: 1px; padding: 6px 12px; border: 1px solid rgba(255,255,255,0.5); border-radius: 999px">{{slide.eyebrow}}</span>
          <h1 style="margin: 0; font-size: 46px; line-height: 1.25; font-weight: 900; letter-spacing: -1.5px; white-space: pre-line">{{slide.title}}</h1>

          <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px">
            <button type="button" onClick="{{slide.go}}" style="height: 52px; padding: 0 26px; border: none; border-radius: 999px; background: #FFFFFF; color: #2B2B75; font-weight: 700; font-size: 16px; cursor: pointer">{{slide.cta}}</button>
            <button type="button" onClick="{{goCounsel}}" style="height: 52px; padding: 0 26px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.6); background: transparent; color: #FFFFFF; font-weight: 700; font-size: 16px; cursor: pointer">수강 상담 받기</button>
          </div>
        </div>

            <div style="position: absolute; left: 14%; top: 8%; width: 50%; height: 50%; border-radius: 999px; background: {{slide.accent}}"></div>
            <div style="position: absolute; left: 4%; top: 36%; width: 50%; height: 50%; border-radius: 999px; background: rgba(173,140,180,0.85)"></div>
            <div style="position: absolute; right: 8%; bottom: 10%; width: 48%; height: 46%; border-radius: 24px; background: rgba(255,255,255,0.94); display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; box-sizing: border-box; color: #2B2B75; gap: 4px">
              <span style="font-size: 12px; font-weight: 700; color: #5A6078">{{slide.badgeLabel}}</span>
              <span style="font-size: 21px; font-weight: 900; line-height: 1.3; white-space: pre-line">{{slide.badge}}</span>
            </div>
            
          </div>
        </div>
      </div>

        <button type="button" aria-label="이전 배너" onClick="{{prevSlide}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.5); background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        </button>
        <span style="font-size: 14px; font-weight: 700; min-width: 48px; text-align: center">{{slideCounter}}</span>
        <button type="button" aria-label="다음 배너" onClick="{{nextSlide}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.5); background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
        <div style="display: flex; gap: 8px; margin-left: 8px">
          <sc-for list="{{dots}}" as="dot" hint-placeholder-count="3">
            <button type="button" aria-label="{{dot.label}}" onClick="{{dot.go}}" style="width: {{dot.w}}; height: 8px; padding: 0; border: none; border-radius: 999px; background: {{dot.bg}}; cursor: pointer"></button>
          </sc-for>
        </div>
      </div>
    </section>

      </div>

    <!-- 홈: 클래스 미리보기 -->
    <section style="max-width: 1200px; margin: 0 auto; padding: 56px 24px 72px; box-sizing: border-box">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 14px; font-weight: 700; color: {{accent}}">CLASS</span>
          <h2 style="margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -1px">신규 &amp; 이벤트 클래스</h2>
        </div>
        <button type="button" onClick="{{goClasses}}" style="border: none; background: none; padding: 10px 0; font-size: 15px; font-weight: 700; color: #2B2B75; cursor: pointer">전체 클래스 보기 ›</button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 28px 24px">
        <sc-for list="{{previewCourses}}" as="co" hint-placeholder-count="4">
          <article style="display: flex; flex-direction: column; gap: 12px; min-width: 0">
            <div style="position: relative; aspect-ratio: 16 / 10; border-radius: 16px; background: {{co.color}}; overflow: hidden; display: flex; align-items: flex-end; padding: 18px; box-sizing: border-box">
              <div style="position: absolute; right: -30px; top: -30px; width: 140px; height: 140px; border-radius: 999px; background: rgba(255,255,255,0.14)"></div>
              <span style="position: relative; color: #FFFFFF; font-size: 22px; font-weight: 900">{{co.cat}}</span>
              <button type="button" aria-label="{{co.wishLabel}}" aria-pressed="{{co.wished}}" onClick="{{co.toggle}}" style="position: absolute; right: 10px; top: 10px; width: 44px; height: 44px; border: none; border-radius: 999px; background: rgba(255,255,255,0.92); display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="{{co.heartFill}}" stroke="{{co.heartStroke}}" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
              </button>
            </div>
            <span style="font-size: 13px; color: #5A6078">{{co.teacher}}</span>
            <h3 style="margin: 0; font-size: 17px; font-weight: 700; line-height: 1.45">{{co.title}}</h3>
            <span style="font-size: 14px; font-weight: 700; color: {{co.priceColor}}">{{co.price}}</span>
          </article>
        </sc-for>
      </div>
    </section>

    <!-- 홈: 성장 스토리 -->
    <section style="background: #2B2B75; color: #FFFFFF">
      <div style="max-width: 1200px; margin: 0 auto; padding: 72px 24px; box-sizing: border-box">
        <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 32px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 14px; font-weight: 700; color: #F4D262">STORY</span>
            <h2 style="margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -1px">함께 성장한 이야기</h2>
          </div>
          <button type="button" onClick="{{goCommunity}}" style="border: none; background: none; padding: 10px 0; font-size: 15px; font-weight: 700; color: #FFFFFF; cursor: pointer">전체보기 ›</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px">
          <sc-for list="{{stories}}" as="st" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; gap: 14px">
              <div style="aspect-ratio: 4 / 3; border-radius: 16px; background: #3C3B86; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #C9CEE0">[인터뷰 사진]</div>
              <span style="font-size: 13px; color: #C9CEE0">[수강생 이름] · [수강한 클래스]</span>
              <span style="font-size: 19px; font-weight: 700; line-height: 1.45">{{st.title}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </section>

    <!-- 홈: 공지 + 자유게시판 -->
    <section style="max-width: 1200px; margin: 0 auto; padding: 72px 24px; box-sizing: border-box">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px">
        <div style="border: 1px solid #E5E7EE; border-radius: 20px; padding: 28px">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px">
            <h3 style="margin: 0; font-size: 21px; font-weight: 900">공지사항</h3>
            <button type="button" onClick="{{goNotice}}" style="border: none; background: none; padding: 10px 0; font-size: 14px; color: #4B5168; cursor: pointer">전체보기 ›</button>
          </div>
          <sc-for list="{{noticePreview}}" as="p" hint-placeholder-count="4">
            <div style="display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid #F0F1F5; font-size: 15px">
              <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"><b style="color: {{p.tagColor}}">{{p.tag}}</b> {{p.title}}</span>
              <span style="color: #5A6078; font-size: 13px; flex-shrink: 0">{{p.date}}</span>
            </div>
          </sc-for>
        </div>
        <div style="border: 1px solid #E5E7EE; border-radius: 20px; padding: 28px">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px">
            <h3 style="margin: 0; font-size: 21px; font-weight: 900">자유게시판</h3>
            <button type="button" onClick="{{goFree}}" style="border: none; background: none; padding: 10px 0; font-size: 14px; color: #4B5168; cursor: pointer">전체보기 ›</button>
          </div>
          <sc-for list="{{freePreview}}" as="p" hint-placeholder-count="4">
            <div style="display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid #F0F1F5; font-size: 15px">
              <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.title}}</span>
              <span style="color: #5A6078; font-size: 13px; flex-shrink: 0">{{p.date}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </section>

    <!-- 홈: 수강후기 -->
    <section style="background: #F4F5F8">
      <div style="max-width: 1200px; margin: 0 auto; padding: 72px 24px; box-sizing: border-box">
        <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 32px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 14px; font-weight: 700; color: {{accent}}">REVIEW</span>
            <h2 style="margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -1px">수강생이 직접 남긴 후기</h2>
          </div>
          <button type="button" onClick="{{goReview}}" style="border: none; background: none; padding: 10px 0; font-size: 15px; font-weight: 700; color: #2B2B75; cursor: pointer">전체보기 ›</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px">
          <sc-for list="{{reviews}}" as="r" hint-placeholder-count="3">
            <article style="background: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 14px">
              <span role="img" aria-label="별점 5점 만점에 5점" style="font-size: 18px; color: #B45309; letter-spacing: 2px">★★★★★</span>
              <h3 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.4">{{r.title}}</h3>
              <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #3A4058">{{r.body}}</p>
              <div style="margin-top: auto; padding-top: 14px; border-top: 1px solid #F0F1F5; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 14px; font-weight: 700">{{r.name}}</span>
                <span style="font-size: 13px; color: #5A6078">{{r.course}}</span>
              </div>
            </article>
          </sc-for>
        </div>
      </div>
    </section>
  </sc-if>

  <!-- ===================== 연구소 소개 ===================== -->
  <sc-if value="{{isAbout}}" hint-placeholder-val="{{ false }}">
    <!-- 그라겜 연구소 소개 -->
    <sc-if value="{{aboutIntro}}" hint-placeholder-val="{{ true }}">
    <section style="max-width: 1200px; margin: 0 auto; padding: 72px 24px; box-sizing: border-box">

    <!-- 언론 속 그라겜 -->
    <sc-if value="{{aboutPress}}" hint-placeholder-val="{{ false }}">
    <section style="max-width: 1200px; margin: 0 auto; padding: 48px 24px 88px; box-sizing: border-box">
      <sc-if value="{{pressIsList}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 12px">
          <span style="font-size: 14px; color: #4B5168">{{pressCount}}</span>
          <div style="display: flex; gap: 8px">
            <label for="press-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">게시물 검색</label>
            <input id="press-search" type="search" placeholder="제목 검색" style="height: 44px; width: 220px; max-width: 100%; padding: 0 14px; border: 1px solid #D6D9E3; border-radius: 10px; font-size: 14px">
            <button type="button" style="height: 44px; padding: 0 18px; border: none; border-radius: 10px; background: #2B2B75; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer">검색</button>
          </div>
        </div>
        <div style="overflow-x: auto">
          <div style="min-width: 600px; border-top: 2px solid #2B2B75">
            <div style="display: flex; align-items: center; gap: 16px; padding: 14px 12px; background: #F4F5F8; border-bottom: 1px solid #E5E7EE; font-size: 14px; font-weight: 700; color: #3A4058">
              <span style="flex: 1 1 auto; text-align: center">제목</span>
              <span style="width: 90px; flex-shrink: 0; text-align: center">작성자</span>
              <span style="width: 100px; flex-shrink: 0; text-align: center">등록일</span>
              <span style="width: 70px; flex-shrink: 0; text-align: center">조회수</span>
            </div>
            <sc-for list="{{press}}" as="pr" hint-placeholder-count="6">
              <div style="display: flex; align-items: center; gap: 16px; padding: 8px 12px; border-bottom: 1px solid #E5E7EE; font-size: 15px">
                <button type="button" onClick="{{pr.open}}" style="flex: 1 1 auto; min-width: 0; min-height: 44px; padding: 0; border: none; background: none; text-align: left; font-size: 15px; color: #2B2B75; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{pr.title}}</button>
                <span style="width: 90px; flex-shrink: 0; text-align: center; color: #4B5168; font-size: 14px">{{pr.writer}}</span>
                <span style="width: 100px; flex-shrink: 0; text-align: center; color: #5A6078; font-size: 13px">{{pr.date}}</span>
                <span style="width: 70px; flex-shrink: 0; text-align: center; color: #5A6078; font-size: 13px">{{pr.views}}</span>
              </div>
            </sc-for>
          </div>
        </div>
        <nav aria-label="페이지" style="display: flex; justify-content: center; gap: 6px; margin-top: 32px">
          <button type="button" aria-current="page" style="width: 44px; height: 44px; border: none; border-radius: 10px; background: #2B2B75; color: #FFFFFF; font-size: 14px; font-weight: 700">1</button>
        </nav>
      </sc-if>

      <sc-if value="{{pressIsDetail}}" hint-placeholder-val="{{ false }}">
        <article style="border-top: 2px solid #2B2B75">
          <div style="padding: 24px 12px; border-bottom: 1px solid #E5E7EE; display: flex; flex-direction: column; gap: 12px">
            <h2 style="margin: 0; font-size: 24px; font-weight: 900; line-height: 1.4; letter-spacing: -0.5px">{{pSel.title}}</h2>
            <div style="display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 14px; color: #4B5168">
              <span>작성자 <b style="color: #2B2B75">{{pSel.writer}}</b></span>
              <span>등록일 {{pSel.date}}</span>
              <span>조회수 {{pSel.views}}</span>
            </div>
          </div>
          <div style="padding: 32px 12px 40px; border-bottom: 1px solid #E5E7EE; display: flex; flex-direction: column; gap: 20px; font-size: 16px; line-height: 1.8; color: #3A4058">
            <div style="aspect-ratio: 16 / 9; max-width: 720px; border-radius: 16px; background: #F6EDF3; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #5A6078">[기사 이미지]</div>
            <p style="margin: 0">[기사 내용 또는 요약을 입력하세요]</p>
            <a href="#press-link" style="align-self: flex-start; display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #2B2B75; font-size: 14px; font-weight: 700">원문 기사 보기 ›</a>
          </div>
          <div style="display: flex; justify-content: center; margin-top: 28px">
            <button type="button" onClick="{{closePress}}" style="height: 48px; padding: 0 32px; border: none; border-radius: 999px; background: #2B2B75; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">목록으로</button>
          </div>
        </article>
      </sc-if>
    </section>
    </sc-if>
  </sc-if>

  <!-- ===================== 클래스 ===================== -->
  <sc-if value="{{isClasses}}" hint-placeholder-val="{{ false }}">
    <section style="max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px; box-sizing: border-box">
      <div role="group" aria-label="클래스 분야" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 32px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
          <button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="height: 48px; padding: 0 24px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 16px; font-weight: 700; cursor: pointer">{{c.name}}</button>

<script>
(function(){
  var WHOLE=/^\{\{\s*([^}]+?)\s*\}\}$/, ANY=/\{\{\s*([^}]+?)\s*\}\}/g;
  var EVENTS={onclick:'click',onmouseenter:'mouseenter',onmouseleave:'mouseleave'};
  function lookup(scope,path){
    path=path.trim();
    if(path==='true')return true; if(path==='false')return false;
    if(/^-?\d+(\.\d+)?$/.test(path))return Number(path);
    var v=scope, ks=path.split('.');
    for(var i=0;i<ks.length;i++){ if(v==null)return undefined; v=v[ks[i]]; }
    return v;
  }
  function interp(str,scope){ return str.replace(ANY,function(_,p){ var v=lookup(scope,p); return v==null?'':String(v); }); }
  function renderNodes(nodes,scope,parent){ for(var i=0;i<nodes.length;i++) renderNode(nodes[i],scope,parent); }
  function renderNode(n,scope,parent){
    if(n.nodeType===3){ parent.appendChild(document.createTextNode(n.nodeValue.indexOf('{{')>-1?interp(n.nodeValue,scope):n.nodeValue)); return; }
    if(n.nodeType!==1) return;
    var tag=n.localName;
    if(tag==='sc-if'){ var m=WHOLE.exec(n.getAttribute('value')||''); if(m&&lookup(scope,m[1])) renderNodes(n.childNodes,scope,parent); return; }
    if(tag==='sc-for'){
      var lm=WHOLE.exec(n.getAttribute('list')||''); var list=lm?lookup(scope,lm[1]):[]; var as=n.getAttribute('as');
      (list||[]).forEach(function(it,i){ var s=Object.create(scope); s[as]=it; s.$index=i; renderNodes(n.childNodes,s,parent); });
      return;
    }
    var el=n.cloneNode(false), attrs=Array.prototype.slice.call(n.attributes);
    attrs.forEach(function(a){
      var name=a.name.toLowerCase(), val=a.value;
      if(name.indexOf('hint-')===0){ el.removeAttribute(a.name); return; }
      if(EVENTS[name]){ el.removeAttribute(a.name); var em=WHOLE.exec(val); var fn=em&&lookup(scope,em[1]); if(typeof fn==='function') el.addEventListener(EVENTS[name],function(e){ fn(e); }); return; }
      if(val.indexOf('{{')>-1){ var wm=WHOLE.exec(val); var out=wm?lookup(scope,wm[1]):interp(val,scope); if(out==null||out===false&&name.indexOf('aria-')!==0){ el.removeAttribute(a.name); } else el.setAttribute(a.name,String(out)); }
    });
    renderNodes(n.childNodes,scope,el);
    parent.appendChild(el);
  }
  var root=document.getElementById('app'), tpl=document.getElementById('tpl').content, comp;
  function render(){ var frag=document.createDocumentFragment(); renderNodes(tpl.childNodes,comp.renderVals(),frag); root.replaceChildren(frag); }
  window.DCLogic=function(props){ this.props=props; this.state=undefined; };
  window.DCLogic.prototype.setState=function(p){
    var cur=this.state||{}, changed=false;
    for(var k in p){ if(cur[k]!==p[k]){ changed=true; break; } }
    if(!changed) return;
    this.state=Object.assign({},cur,p); render();
  };
  window.__mount=function(C,props){ comp=new C(props); render(); if(comp.componentDidMount) comp.componentDidMount(); };
})();
</script>

  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const s = this.state || {};

    const nav = (p, extra) => () => {
